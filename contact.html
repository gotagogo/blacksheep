    <a class="brand" href="index.html"><span class="mini-sheep"><span></span></span><strong>Black Sheep</strong></a>

  <main class="section-wrap page contact-page">
    <p class="eyebrow">Say baa</p>
    <h1>Got a suspiciously fluffy idea?</h1>
    <p class="lead">This static page has a front-end form layout only. Connect it to Formspree, Netlify Forms, Cloudflare Pages Functions, or your own backend when ready.</p>
    <form class="contact-form" action="#" method="post">
      <label>Name <input type="text" name="name" placeholder="Your name" /></label>
      <label>Email <input type="email" name="email" placeholder="you@example.com" /></label>
      <label>Message <textarea name="message" rows="5" placeholder="Tell us your black sheep idea..."></textarea></label>
      <button class="button primary" type="submit">Send baa</button>
    </form>
  </main>
  <footer><p>© <span id="year"></span> Black Sheep.</p></footer>
